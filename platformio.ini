; ESPJack - Offensive-security toolkit, serial-CLI only.
; Targets any ESP32-S3 board with a microSD card attached over SPI.
;
; This profile builds against the generic "esp32-s3-devkitc-1" board
; definition, which works for essentially any ESP32-S3 module/devkit (it
; only affects flash size/partitioning defaults, not pin assignments).
; microSD pins default to the M5Stack Cardputer ADV wiring (see
; ESPJACK_SD_* in src/config.h) and are editable at runtime via the
; 'settings' CLI command (persisted to /settings.json) - no rebuild needed
; to use this on a different board.
;
; Everything happens over the serial console (115200 8N1): a Linux-style
; CLI with a banner, a `root@espjack#` prompt, per-command `-h` help, and
; Ctrl+C to cancel a running command.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    marian-craciunescu/ESP32Ping @ ^1.7
    ; WireGuard tunnel (pivot module). This fork ports the original
    ; ciniml/WireGuard-ESP32 off the removed tcpip_adapter.h API onto
    ; esp_netif, so it builds against modern Arduino-ESP32 cores.
    https://github.com/Aranyalma2/WireGuard-ESP32-Arduino.git

; The board definition forces hardware CDC/JTAG (ARDUINO_USB_MODE=1); strip
; it so we can select TinyUSB (OTG) mode below. TinyUSB lets the device
; expose a composite CDC (this console) + MSC (the 'mount' SD-as-USB-drive)
; at the same time.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DARDUINO_USB_MODE=0          ; TinyUSB composite (CDC + MSC)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; serial console over the S3's native USB
    -DCORE_DEBUG_LEVEL=2
